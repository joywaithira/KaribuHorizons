<!-- Checking Database Connection 
 In a terminal, run the following command to check if the database connection is working:
 php -S 127.0.0.1:8000

 Then, in another terminal, check:
 http://127.0.0.1:8000/admin/login.php

 If it says 200 OK, the database connection is working. If it says 500 Internal Server Error, check the database connection settings in config.php and ensure the database server is running.
 If you get the 'Address already in use' error, it means the port is already in use. You can either stop the process using that port or use a different port by changing the command to:
 php -S 127.0.0.1:8000



-->
